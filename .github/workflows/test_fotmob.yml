name: Test FotMob (temporaire)

# FotMob répond-il aux serveurs de GitHub ? (2026-11-22) À supprimer après le test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages FotMob depuis GitHub
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for u in "https://www.fotmob.com/teams/8633/fixtures/real-madrid" "https://www.fotmob.com/matches/real-madrid-vs-celta-vigo/2uda7y"; do
            code=$(curl -s -o page.html -w "%{http_code}" -m 60 -A "$UA" "$u" || echo "échec")
            echo "$u -> HTTP $code, $(wc -c < page.html) octets"
            python3 - <<'EOF'
          import json, re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          if not m:
              print("   PAS de __NEXT_DATA__ ; début de la page :", h[:300].replace("\n", " "))
          else:
              p = json.loads(m.group(1))["props"]["pageProps"]
              c = p.get("content") or {}
              if c:
                  print("   match : momentum", len(((c.get("momentum") or {}).get("main") or {}).get("data") or []), "points,",
                        len((c.get("shotmap") or {}).get("shots") or []), "tirs, périodes", list(((c.get("stats") or {}).get("Periods") or {}).keys()))
              else:
                  f = p["fallback"]["team-8633"]["fixtures"]["allFixtures"]["fixtures"]
                  print("   calendrier :", len(f), "matchs")
          EOF
          done
