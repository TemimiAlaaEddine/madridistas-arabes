name: Mise à jour du site et threads

on:
  # déclenché chaque heure (7 h - 23 h, Europe/Madrid) par cron-job.org : la planification GitHub sautait des passages
  workflow_dispatch: # bouton « Run workflow » (aussi dans l'app GitHub) : passage à la demande, ex. avant un match

concurrency: mise_a_jour # jamais deux passages en même temps

permissions:
  contents: write

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser pillow
      - name: Paquets npm déjà téléchargés (Claude Code s'installe sans tout retélécharger)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ github.run_id }}
          restore-keys: npm-
      - run: npm install -g @anthropic-ai/claude-code
      - name: Photos et couvertures déjà faites (évite de tout refaire)
        uses: actions/cache@v6
        with:
          path: |
            site/photos
            site/couvertures
          key: images-${{ github.run_id }}
          restore-keys: images-
      - name: Collecte, rédaction, threads
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python generer_site.py
      - name: Sauvegarde de la base dans le dépôt
        if: always()
        run: |
          python -c "import commun; commun.sauvegarder_base(commun.BASE / 'articles.db')"
          git config user.name "mise-a-jour"
          git config user.email "actions@users.noreply.github.com"
          git add articles.sql photos.json
          git diff --cached --quiet || (git commit -m "Passage du $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull --rebase && git push)
