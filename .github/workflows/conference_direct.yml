name: Conférence de presse en direct

# Lancé par le workflow principal (mise_a_jour.yml) : jusqu'à 45 min avant l'entraînement annoncé avec conférence (calendrier
# du club, qui le retire dès qu'il commence ; heure = cet entraînement, attendu ici), ou à la première déclaration de Marca ou
# d'AS (après un match : venue de la salle de presse). Marca et AS lus chaque minute ; le premier à publier une vraie déclaration
# est suivi seul ; chaque déclaration tweetée tout de suite (conference.py). Bouton « Run workflow » : test à blanc.
on:
  workflow_dispatch:
    inputs:
      journal:
        description: "Journal suivi (auto : le premier de Marca ou AS à publier)"
        required: true
        type: choice
        options: [auto, Marca, AS]
      heure:
        description: "Heure UTC de l'entraînement suivi d'une conférence (AAAA-MM-JJTHH:MM:SS), vide si lancé sur un article"
        default: ""
      a_blanc:
        description: "Test à blanc : affiche les tweets sans les publier"
        type: boolean
        default: false

# « à blanc » dans le nom : le passage principal ignore ce run (calendrier.direct_actif) et ne retient pas les nouvelles
run-name: ${{ inputs.a_blanc && 'Conférence à blanc' || 'Conférence en direct' }} (${{ inputs.journal }})

concurrency: conference_direct # un seul direct à la fois

permissions:
  contents: write # conference.json : direct en cours et articles déjà tweetés, lus par le passage principal

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 45 min avant l'entraînement, attente de la conférence (3 h 30 au plus), puis 90 min de direct au plus
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser pillow
      - name: Paquets npm déjà téléchargés
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ github.run_id }}
          restore-keys: npm-
      - run: npm install -g @anthropic-ai/claude-code
      - name: Une lecture par minute, jusqu'à 10 min sans déclaration
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
        run: |
          git config user.name "conference-direct"
          git config user.email "actions@users.noreply.github.com"
          python conference.py --suivre "${{ inputs.journal }}" --heure "${{ inputs.heure }}" ${{ inputs.a_blanc && '--a-blanc' || '' }}
