name: Mise à jour du site et threads

on:
  # déclenché par cron-job.org (la planification GitHub sautait des passages) ; dépôt public : minutes illimitées
  workflow_dispatch: # bouton « Run workflow » (aussi dans l'app GitHub) : passage à la demande, ex. avant un match
    inputs:
      unes_maintenant:
        description: "Publier tout de suite les unes de Marca et AS du jour (hors de la fenêtre minuit-midi)"
        type: boolean
        default: false

concurrency: mise_a_jour # jamais deux passages en même temps

permissions:
  contents: write
  issues: write # issue d'alerte quand un envoi échoue 3 passages de suite

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # dernier état de la branche au démarrage du job, pas celui du déclenchement : un job resté une heure en file
          # repartait d'une base périmée (threads republiés, conflit au push)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser pillow
      - name: Paquets npm déjà téléchargés (Claude Code s'installe sans tout retélécharger)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ github.run_id }}
          restore-keys: npm-
      - run: npm install -g @anthropic-ai/claude-code
      - name: Photos et couvertures déjà faites (évite de tout refaire)
        uses: actions/cache@v6
        with:
          path: |
            site/photos
            site/couvertures
          key: images-${{ github.run_id }}
          restore-keys: images-
      - name: Collecte, rédaction, threads
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1 # chaque ligne du journal a son heure réelle : on voit quelle étape est lente
          FORCER_UNES: ${{ inputs.unes_maintenant && '1' || '' }}
        run: python generer_site.py
      - name: Sauvegarde de la base dans le dépôt
        if: always()
        run: |
          python -c "import commun; commun.sauvegarder_base(commun.BASE / 'articles.db')"
          git config user.name "mise-a-jour"
          git config user.email "actions@users.noreply.github.com"
          git add articles.sql photos.json
          git diff --cached --quiet || (git commit -m "Passage du $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull --rebase && git push)
      - name: Alerte (envoi en échec depuis 3 passages)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s alerte.md ]; then
            gh issue create --title "Alerte : envoi en échec ($(date -u +'%Y-%m-%d %H:%M') UTC)" --body-file alerte.md
          fi

  # tableau de bord de l'équipe (statut.py) sur GitHub Pages, même si le passage a échoué : c'est là qu'on le voit
  tableau:
    needs: passage
    if: always()
    continue-on-error: true # le passage reste « réussi » si seule la publication du tableau échoue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # avec la base que le passage vient de pousser
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser # importé par commun.py
      - run: python statut.py
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-pages-artifact@v3
        with:
          path: statut
      - id: deploiement
        uses: actions/deploy-pages@v4
