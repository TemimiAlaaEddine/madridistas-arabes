name: Revue des sources

on:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi, 7 h heure d'Espagne : une issue avec le bilan des sources
  workflow_dispatch: # bouton « Run workflow » : revue à la demande

permissions:
  contents: write # matchs.json (calendrier) enregistré dans le dépôt
  issues: write

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser
      - run: npm install -g @anthropic-ai/claude-code
      - name: Rapport
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python sources.py > rapport.md
      - name: Santé technique (jeton Facebook, quota Typefully, pannes en cours)
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python sante.py >> rapport.md
      - name: Tableau de bord Facebook (semaine écoulée)
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python performance.py >> rapport.md
      - name: Audit de conformité (20 publications de la semaine relues par Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python audit.py >> rapport.md
      - name: Calendrier (5 prochains matchs, page du site officiel, sans Claude)
        env:
          PYTHONIOENCODING: utf-8
        run: python calendrier.py >> rapport.md
      - name: Calendrier enregistré dans le dépôt
        run: |
          git config user.name "mise-a-jour"
          git config user.email "actions@users.noreply.github.com"
          git add matchs.json
          git diff --cached --quiet || (git commit -m "Calendrier des 5 prochains matchs" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done)
      - name: Issue GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Revue des sources du $(date -u +%Y-%m-%d)" --body-file rapport.md
