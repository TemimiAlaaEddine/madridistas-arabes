name: Test à blanc du suivi Sofascore (temporaire)

# Suit un match d'une autre équipe depuis les serveurs de GitHub, comme suivre_match (Sofascore via Bright Data), et affiche
# les tweets qui partiraient, sans rien publier (pas de clé Typefully). 2026-11-22, à supprimer après le test.
on:
  workflow_dispatch:
    inputs:
      equipe:
        description: "Identifiant Sofascore de l'équipe"
        required: true
      debut:
        description: "Coup d'envoi en UTC (AAAA-MM-JJTHH:MM:SS)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install feedparser pillow
      - name: Suivi à blanc, toutes les 5 minutes, du coup d'envoi à la fin du match
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          EQUIPE: ${{ inputs.equipe }}
          DEBUT: ${{ inputs.debut }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
        run: |
          python - <<'EOF'
          import os, time
          from datetime import datetime, timedelta, timezone
          import calendrier as c
          import match
          c.nom_arabe_claude = lambda nom: nom  # pas de Claude ici : nom latin si Sofascore n'a pas l'arabe
          equipe, debut = int(os.environ["EQUIPE"]), datetime.fromisoformat(os.environ["DEBUT"])
          maintenant = lambda: datetime.now(timezone.utc).replace(tzinfo=None)
          attente = (debut - timedelta(minutes=5) - maintenant()).total_seconds()
          if attente > 0:
              print(f"Attente du coup d'envoi : {attente / 60:.0f} min")
              time.sleep(attente)
          vus, fini = set(), 0
          while maintenant() < debut + timedelta(hours=2, minutes=30) and fini < 2:
              h = maintenant().strftime("%H:%M")
              try:
                  trouve = None
                  for sens in ("next", "last"):  # même recherche que calendrier.evenement
                      for e in match.sofascore(f"team/{equipe}/events/{sens}/0").get("events", []):
                          if abs(e["startTimestamp"] - debut.replace(tzinfo=timezone.utc).timestamp()) < 3 * 3600:
                              trouve = (e, sens)
                              break
                      if trouve:
                          break
                  if not trouve:
                      print(f"{h} ! match introuvable (ni events/next ni events/last)")
                  else:
                      e, sens = trouve
                      st = e["status"]
                      inc = [] if st.get("type") == "notstarted" else match.sofascore(f"event/{e['id']}/incidents").get("incidents", [])
                      print(f"{h} trouvé dans events/{sens} | statut type={st.get('type')} code={st.get('code')} « {st.get('description')} » | "
                            f"{e['homeTeam']['name']} {e.get('homeScore', {}).get('current')}-{e.get('awayScore', {}).get('current')} "
                            f"{e['awayTeam']['name']} | {len(inc)} incidents")
                      for cle, texte in c.tweets_du_match(e, inc):
                          if cle not in vus:
                              vus.add(cle)
                              print(f"   >> TWEET « {cle} » (non publié) :\n      " + texte.replace("\n", "\n      "))
                      fini += st.get("type") == "finished"
              except Exception as err:
                  print(f"{h} ! erreur : {err!r}")
              time.sleep(300)
          print("Fin du test :", sorted(vus))
          EOF
